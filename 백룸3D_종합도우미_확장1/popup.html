<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  :root { --bg:#16140e; --card:#211e15; --line:#4a4128; --text:#efe4c0; --sub:#b9ab80; --acc:#e8c45a; }
  body { margin:0; width:290px; background:var(--bg); color:var(--text); font:13px/1.5 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  header img { width:34px; height:34px; border-radius:8px; }
  h1 { font-size:15px; margin:0; }
  header p { margin:0; color:var(--sub); font-size:11px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; border-bottom:1px solid #2a2619; cursor:pointer; }
  .row b { display:block; font-size:14px; }
  .row span.d { color:var(--sub); font-size:11.5px; }
  .sw { position:relative; width:46px; height:26px; flex:none; }
  .sw input { opacity:0; width:0; height:0; }
  .sw i { position:absolute; inset:0; background:#3a3424; border-radius:99px; transition:.2s; }
  .sw i::after { content:""; position:absolute; left:3px; top:3px; width:20px; height:20px; border-radius:50%; background:#d8cba0; transition:.2s; }
  .sw input:checked + i { background:var(--acc); }
  .sw input:checked + i::after { left:23px; background:#2a2310; }
  .note { margin:12px; padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:10px; color:var(--sub); font-size:11.5px; }
  .note b { color:var(--text); }
  kbd { background:#3a3424; border-radius:4px; padding:0 5px; color:var(--text); font-size:11px; }
</style></head>
<body>
  <header><img src="icons/icon48.png" alt=""><div><h1>백룸 3D 종합 도우미</h1><p>엔트리 작품 '백룸 3D' 전용 · 개발자 루나_15</p></div></header>
  <label class="row"><div><b>완전한 3D</b><span class="d">벽 뒤 괴물·가구가 비쳐 보이지 않고, 게임이 가벼워져요</span></div>
    <span class="sw"><input type="checkbox" id="br3d_on"><i></i></span></label>
  <label class="row"><div><b>마우스 고정</b><span class="d">화면을 누르면 마우스가 가운데 고정, 움직이면 시점이 돌아가요</span></div>
    <span class="sw"><input type="checkbox" id="enabled"><i></i></span></label>
  <div class="note"><b>마우스 휠</b>: 설정 창이 열려 있으면 목록 스크롤, 게임 중엔 아이템 칸 이동.<br>
    <b>ESC</b>: 고정이 풀리고 설정 창이 열려요.<br>
    게임 중 <kbd>Alt</kbd>+<kbd>3</kbd>으로 3D를 켜고 끌 수 있어요.<br>
    예전 '엔트리 마우스 고정' 확장은 꺼 주세요.</div>
  <script src="popup.js"></script>
</body></html>
